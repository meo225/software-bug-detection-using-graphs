# CPG là representation ứng viên bao quát, chưa phải cấu hình cố định cho mọi model.
# Theo Task 3.1, hai schema cụ thể được chốt cho thí nghiệm lõi là:
# - Graph A (AST): configs/graph/graph_a.yaml
# - Graph B (AST + CFG + DDG): configs/graph/graph_b.yaml
# Đặc tả kỹ thuật chung và chính sách nhãn: configs/graph/schema_spec.yaml
graph:
  name: cpg
  status: candidate
  extractor: joern
  joern_executable: null
  candidates:
    - ast
    - cfg
    - data_dependency
    - control_dependency
    - pdg
    - cpg
  concrete_schemas:
    graph_a: configs/graph/graph_a.yaml
    graph_b: configs/graph/graph_b.yaml
    spec: configs/graph/schema_spec.yaml
  output_dir: data/graphs
  sample_manifest: data/sample_manifests/diversevul_graph_sample.csv

