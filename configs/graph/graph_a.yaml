# Cấu hình Graph A — Baseline AST (Task 3.1)
# Biểu diễn cây cú pháp trừu tượng trong phạm vi hàm (intra-procedural)
# Tuân thủ: docs/1_3_1_4_graph.md, docs/2_2_cwe_policy.md, docs/2_3_split.md

graph:
  name: "graph_a"
  display_name: "Graph A (AST Baseline)"
  representation_type: "ast"
  scope: "intra_procedural_function"
  description: "Cây cú pháp trừu tượng AST của function C/C++, chỉ giữ quan hệ cha-con có hướng."

  # Node Specification
  nodes:
    domain: "function_ast_nodes"
    features:
      - name: "node_type"
        type: "categorical_string"
        description: "Kiểu cú pháp AST (Method, Block, Call, Identifier, Literal, ControlStructure...)"
      - name: "code_token"
        type: "text_token"
        description: "Token hoặc đoạn mã đại diện sau khi chuẩn hóa bảo thủ"
      - name: "line_number"
        type: "integer"
        description: "Số dòng 1-indexed trong chuỗi mã nguồn function; nếu thiếu kế thừa từ AST cha, fallback = 1 (chỉ lưu trong JSON trung gian để debug)"
      - name: "rel_line_number"
        type: "float"
        description: "Vị trí tương đối = line_number / max(1, len(func.splitlines())) trong khoảng [0.0, 1.0] (được đưa vào tensor PyG)"
    indexing: "zero_indexed_consecutive" # [0, 1, ..., N-1]
    node_ordering:
      traversal: "depth_first_preorder"
      child_order: ["ast_edge_order_asc", "line_number_asc", "column_number_asc", "node_type_asc", "normalized_code_asc", "joern_id_asc"]

  # Edge Specification
  edges:
    types:
      - id: 0
        name: "AST"
        description: "Quan hệ cú pháp cha-con từ node cha trỏ đến node con (parent -> child)"
    direction: "directed"
    allow_reverse_in_storage: false # Không tự nhân đôi cạnh ngược vào file lưu trữ
    allow_self_loops: false # Lọc bỏ nếu gặp self-loop src == dst và thống kê số cạnh bị loại
    deduplication_policy:
      key: ["src", "dst"]
      directed: true
      drop_self_loops: true
      record_drop_statistics: true

  # Cấu hình lưu trữ và trích xuất
  extractor:
    tool: "joern"
    status: "pilot_candidate"
    export_format: "json" # json hoặc dot trong giai đoạn pilot
    timeout_sec: 120

  paths:
    raw_dir: "data/graphs/graph_a/raw"
    processed_dir: "data/graphs/graph_a/processed"
    manifest_file: "data/graphs/graph_a/manifest.csv"
