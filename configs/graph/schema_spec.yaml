# Đặc tả kỹ thuật dùng chung cho Graph Schema (Task 3.1)
# Áp dụng cho tập 9.077 function, 23 CWE trên DiverseVul
# Tuân thủ: docs/1_3_1_4_graph.md, docs/2_2_cwe_policy.md, docs/2_3_split.md

version: "1.0"
dataset:
  name: "diversevul"
  manifest_path: "data/splits/diversevul_experiment_manifest.csv"
  total_samples: 9077
  total_cwe_classes: 23
  label_policy: "single_label_multiclass"

# Bảng ánh xạ chuẩn hóa 23 CWE sang class index [0..22]
# Sắp xếp theo thứ tự bảng chữ cái xác định để đảm bảo tính tái lập tuyệt đối
cwe_mapping:
  "CWE-119": 0
  "CWE-120": 1
  "CWE-125": 2
  "CWE-189": 3
  "CWE-190": 4
  "CWE-20": 5
  "CWE-200": 6
  "CWE-22": 7
  "CWE-264": 8
  "CWE-295": 9
  "CWE-369": 10
  "CWE-399": 11
  "CWE-400": 12
  "CWE-401": 13
  "CWE-415": 14
  "CWE-416": 15
  "CWE-476": 16
  "CWE-59": 17
  "CWE-617": 18
  "CWE-703": 19
  "CWE-770": 20
  "CWE-787": 21
  "CWE-835": 22

# Các split protocols đã chốt (Task 2.3)
split_protocols:
  project_wise:
    dir: "data/splits/diversevul_project_wise"
    train_count: 6983
    validation_count: 1047
    test_count: 1047
    role: "primary_unseen_project_evaluation"
  seen_project:
    dir: "data/splits/diversevul_seen_project"
    train_count: 7272
    validation_count: 902
    test_count: 903
    role: "baseline_seen_project_evaluation"

# Giới hạn kích thước đồ thị để kiểm soát outlier và tránh OOM
size_limits:
  max_nodes: 1000
  max_edges: 3000
  parse_timeout_seconds: 120
  oversized_handling: "flag_and_log" # [flag_and_log, truncate_bfs, drop_with_metric_penalty]

# Các trạng thái trích xuất đồ thị (Extraction Status Enums)
status_enums:
  - "SUCCESS"
  - "EMPTY_GRAPH"
  - "PARSE_ERROR"
  - "TIMEOUT_ERROR"
  - "OVERSIZED_GRAPH"

# Chuẩn hóa bảo thủ node features
normalization:
  clean_whitespace: true
  strip_html_escapes: true
  subtoken_split_identifiers: true
  string_literal_token: "<STR>"
  large_number_token: "<NUM>"
  hex_literal_token: "<HEX>"
  unknown_token: "<UNK>"
  max_token_length: 64

# Quy tắc Vocabulary & Tokenizer Anti-Leakage
vocabulary_policy:
  fit_target: "train_split_only"
  disallow_global_fit: true
  min_token_frequency: 2
  special_tokens:
    pad: "<PAD>"
    unk: "<UNK>"
    mask: "<MASK>"

# Định dạng lưu trữ
storage:
  intermediate_format: "json" # Cấu trúc JSON độc lập vocabulary
  processed_format: "pt"       # PyTorch Geometric Data object sau khi fit vocab
  compression: null           # Hoặc "gzip" nếu cần tối ưu đĩa
