[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-bug-detection-using-graphs"
version = "0.1.0"
description = "Đồ án nghiên cứu phát hiện điểm yếu phần mềm và phân loại CWE bằng biểu diễn đồ thị cùng graph neural network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gnn = ["torch", "torch-geometric"]

[tool.setuptools]
packages = [
    "src",
    "src.data",
    "src.graph",
    "src.models",
    "src.training",
    "src.evaluation",
    "src.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
